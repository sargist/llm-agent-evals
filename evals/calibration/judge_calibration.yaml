    - Ստացող հաշիվ՝ ACC-3001

    - Գումար՝ 200.00 EUR

    - Վճար՝ 0.00 EUR

    - Նշում՝ չկա


    Հաստատու՞մ եք այս փոխանցումը։ Եթե այո, պատասխանեք «Հաստատում եմ»։ Մինչ այդ գումար չի ուղարկվել։'
